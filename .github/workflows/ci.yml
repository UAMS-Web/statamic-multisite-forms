name: CI

# The jobs mirror the scripts `composer ci` runs locally, in the same cost order:
#   composer-validate -> synced-files -> no-emoji -> scripts -> mutate-ignore -> mutation-instrument -> parallel-safe -> pint -> rector -> phpstan -> pest
# Each job `needs:` the one before it, so a failure skips every more expensive job
# after it. The deliberate trade: a successful run is the sum of the jobs, not the
# longest one. When a job's command changes here, change the matching `composer`
# script (and the other way round). The shared setup lives in
# `.github/actions/setup/action.yml`.

on:
  pull_request:
  push:
    branches: [main]
  # Lets the workflow be run on demand against a branch.
  workflow_dispatch:

# A new push to a pull request cancels that pull request's stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  composer-validate:
    name: Composer validate (composer.lock freshness)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      # Fails when composer.json and composer.lock have drifted apart.
      - run: composer validate --no-check-publish --no-check-all

  synced-files:
    name: Synced files (no hand-edited rules or skills)
    needs: composer-validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Fails, naming the file, when a synced rule or skill was edited by hand.
      - run: node .claude/skills/synced-files/scripts/check-synced-files.mjs

  no-emoji:
    name: Repository guards (emoji, decision log)
    needs: synced-files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Fails, naming the file and code points, when an emoji reaches a tracked record.
      - run: node scripts/check-no-emoji.mjs

      # Fails, naming the two entries, when docs/DECISIONS.md is out of order.
      - run: node scripts/check-decision-log-order.mjs

  scripts:
    name: Guard-script tests (vitest)
    needs: no-emoji
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Node 22 bundles npm 10.9.x, below the `engines.npm` floor that `.npmrc`'s
      # engine-strict enforces, so `npm ci` refuses to run without this pin.
      - name: Pin npm to the engines floor
        run: npm install -g npm@^11.10.0

      - run: npm ci
      - run: npm run test:scripts

  mutate-ignore:
    name: Mutation annotations (none inert)
    needs: scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: composer test:mutate-ignore

  mutation-instrument:
    name: Mutation instrument (a mutant child can launch)
    needs: mutate-ignore
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Fails when a mutant child cannot be launched, which would score every mutant killed.
      # A real mutation smoke (one that also asserts mutants were created) waits until src/
      # has logic to mutate.
      - run: composer test:mutation-instrument

  parallel-safe:
    name: Parallel-safe tests (no shared state)
    needs: mutation-instrument
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      # Dependency-free, so it needs PHP and nothing else.
      - run: composer test:parallel-safe

  pint:
    name: Pint
    needs: parallel-safe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: composer test:pint

  rector:
    name: Rector (gating profile)
    needs: pint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: composer test:refactor

  phpstan:
    name: Larastan (PHPStan)
    needs: rector
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: composer stan

  pest:
    name: Pest (Unit and Integration)
    needs: phpstan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # --log-junit feeds the band checks below; it changes nothing about what runs.
      - name: Run the suite
        run: composer test -- --display-all-issues --log-junit junit-parallel.xml

      # Fails when more tests skipped than tests/skip-baseline.json records (a silent skip
      # must not read as a pass), or when one class's cost nears the band's.
      - name: Check the band reports
        run: composer test:bands
