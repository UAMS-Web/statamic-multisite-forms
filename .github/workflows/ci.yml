name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Static analysis, formatting, refactor check, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer install --no-interaction --prefer-dist

      - run: composer ci

      # Fails, naming the file, when a synced rule or skill was edited by hand.
      - name: Check synced files
        run: node .claude/skills/synced-files/scripts/check-synced-files.mjs
