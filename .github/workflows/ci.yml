name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets the workflow be run on demand against a branch.
  workflow_dispatch:

# A new push to a pull request cancels that pull request's stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: Static analysis, formatting, refactor check, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Determine Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # Fails when composer.json and composer.lock have drifted apart.
      - name: Validate composer.json and composer.lock
        run: composer validate --no-check-publish --no-check-all

      - run: composer install --no-interaction --no-progress --prefer-dist

      - run: composer ci

      # Fails, naming the file, when a synced rule or skill was edited by hand.
      - name: Check synced files
        run: node .claude/skills/synced-files/scripts/check-synced-files.mjs
